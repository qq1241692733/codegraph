<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codegraph · 代码知识图谱</title>
<style>
  :root{
    --bg:#0c0f16; --panel:#131722; --panel-2:#1a2132; --panel-3:#222b40; --border:#232c42; --border-soft:#1c2336;
    --text:#e8edf7; --text-2:#a8b3c7; --text-3:#66728a;
    --grad:linear-gradient(135deg,#4f8cff,#7a5cff); --primary:#5b8def;
    --warn:#f0a35e; --info:#4fd1c5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:13px;display:flex;flex-direction:column;overflow:hidden}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:rgba(19,23,34,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:5}
  .brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
  .logo{width:30px;height:30px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;box-shadow:0 0 18px rgba(79,140,255,.45)}
  .brand h1{font-size:15px;font-weight:700;letter-spacing:.3px}
  .brand .sub{font-size:10px;color:var(--text-3);letter-spacing:.6px;text-transform:uppercase}
  .gsearch{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:7px 14px;transition:border-color .2s,box-shadow .2s}
  .gsearch:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,141,239,.18)}
  .gsearch svg{color:var(--text-3);flex-shrink:0}
  .gsearch input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px}
  .gsearch input::placeholder{color:var(--text-3)}
  .gsearch .gbtn{padding:5px 16px;border:none;border-radius:7px;background:var(--grad);color:#fff;font-size:12px;font-weight:600;cursor:pointer}
  .gsearch .gbtn:disabled{opacity:.55;cursor:default}
  .stats{display:flex;flex-shrink:0;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .stat{padding:6px 15px;text-align:center;border-right:1px solid var(--border-soft)}
  .stat:last-child{border-right:none}
  .stat b{display:block;font-size:15px;font-weight:700;color:#fff}
  .stat span{font-size:9.5px;color:var(--text-3);letter-spacing:.6px}
  main{flex:1;display:flex;min-height:0;position:relative}
  aside{width:284px;min-width:284px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:margin-left .25s}
  aside.collapsed{margin-left:-284px}
  #graph{flex:1;position:relative;background:radial-gradient(ellipse at 50% 30%,#16203a 0%,#0c0f16 68%)}
  .sec{padding:14px 16px;border-bottom:1px solid var(--border-soft)}
  .sec .title{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .sec h3{font-size:10.5px;color:var(--text-3);font-weight:600;letter-spacing:1.2px;text-transform:uppercase}
  .badge{font-size:10px;color:var(--text-3);background:var(--panel-3);padding:1px 7px;border-radius:10px}
  .field{display:flex;gap:7px}
  .field input{flex:1;min-width:0;padding:8px 11px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12.5px;outline:none}
  .field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,141,239,.15)}
  .field input::placeholder{color:var(--text-3)}
  .btn{padding:8px 13px;border:none;border-radius:8px;background:var(--grad);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:default}
  .list{display:flex;flex-direction:column;gap:4px;margin-top:9px;max-height:150px;overflow-y:auto}
  .row{padding:6px 10px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:7px;font-size:11.5px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .row:hover{border-color:var(--primary);background:var(--panel-3)}
  .row .id{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
  .row .tag{font-size:9px;padding:1px 6px;border-radius:9px;flex-shrink:0;color:var(--text-2);background:rgba(255,255,255,.06)}
  .hint{color:var(--text-3);font-size:11px;margin-top:8px;line-height:1.6}
  .langs{display:flex;flex-wrap:wrap;gap:6px}
  .lang{font-size:11px;padding:3px 10px;border-radius:14px;background:var(--panel-2);border:1px solid var(--border);color:var(--text-2)}
  .lang b{color:var(--text);font-weight:600}
  .legend{position:absolute;bottom:16px;left:16px;background:rgba(19,23,34,.9);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:11px;display:flex;gap:14px;flex-wrap:wrap;box-shadow:0 8px 30px rgba(0,0,0,.45);z-index:2}
  .legend span{display:flex;align-items:center;gap:6px;color:var(--text-2)}
  .legend i{width:12px;height:12px;border-radius:3px}
  .legend .hex{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--info)}
  .legend .sq{background:var(--warn);border-radius:2px}
  .legend .ln{width:16px;height:2.5px;border-radius:2px;background:#8a94ff}
  #drawer{position:absolute;top:0;right:0;bottom:0;width:340px;background:var(--panel);border-left:1px solid var(--border);box-shadow:-8px 0 30px rgba(0,0,0,.4);transform:translateX(105%);transition:transform .25s ease;z-index:4;display:flex;flex-direction:column;overflow:hidden}
  #drawer.open{transform:translateX(0)}
  .dhead{padding:14px 18px;border-bottom:1px solid var(--border-soft)}
  .dhead .name{font-size:14px;font-weight:650;word-break:break-all;display:flex;align-items:center;gap:7px}
  .dhead .fqn{font-size:11px;color:var(--text-3);margin-top:5px;word-break:break-all}
  .type-badge{font-size:9.5px;padding:2px 8px;border-radius:8px;font-weight:600;letter-spacing:.4px;color:#fff;flex-shrink:0}
  .tb-fn{background:#2b4a8f}.tb-cl{background:#1f6b62}.tb-fl{background:#7a4a1e}
  .close{background:none;border:none;color:var(--text-3);font-size:18px;cursor:pointer;line-height:1;padding:2px;float:right}
  .close:hover{color:var(--text)}
  .dbody{flex:1;overflow-y:auto;padding:12px 18px}
  .dsec{font-size:10px;color:var(--text-3);letter-spacing:1px;text-transform:uppercase;margin:14px 0 7px;font-weight:600}
  .dsec:first-child{margin-top:4px}
  .kv{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--border-soft)}
  .kv .depth{color:var(--text-3);font-size:10.5px;flex-shrink:0}
  .kv .idv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kv .up{color:#3ecf8e}.kv .down{color:var(--info)}
  .dempty{padding:14px 0;color:var(--text-3);font-size:12px}
  #empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3);text-align:center;z-index:1;pointer-events:none}
</style>
<script src="/static/g6.min.js"></script>
</head>
<body>
<header>
  <div class="brand"><div class="logo">cg</div><div><h1>codegraph</h1><div class="sub">Code Knowledge Graph</div></div></div>
  <div class="gsearch">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="searchInput" placeholder="语义检索：输入意图，如「做登录鉴权的函数」" autocomplete="off">
    <button class="gbtn" id="searchBtn" disabled>检索</button>
  </div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <aside id="sidebar">
    <div class="sec">
      <div class="title"><h3>符号定位</h3></div>
      <div class="field"><input id="symInput" placeholder="如 Gson.fromJson" autocomplete="off"><button class="btn" id="symBtn">定位</button></div>
      <div class="list" id="symList"></div>
      <div class="hint">点击结果：加载该符号局部子图并聚焦。</div>
    </div>
    <div class="sec" style="flex:1;min-height:120px;display:flex;flex-direction:column">
      <div class="title"><h3>模块 · 文件</h3><span class="badge" id="modCount">0</span></div>
      <div class="list" style="max-height:none;flex:1" id="modList"></div>
    </div>
    <div class="sec">
      <div class="title"><h3>语言分布</h3></div>
      <div class="langs" id="langBar"></div>
    </div>
  </aside>
  <div id="graph">
    <div id="empty">搜索符号、点击模块，或点击节点逐层展开</div>
    <div class="legend">
      <span><i class="sq"></i>File</span><span><i class="hex"></i>Class</span>
      <span><i class="ln" style="background:#5b8def;border-radius:50%"></i>Function</span>
      <span><i class="ln"></i>CALLS</span>
      <span><i class="ln" style="background:#3d4c66"></i>CONTAINS</span>
      <span><i class="ln" style="background:#9d7bff"></i>HAS_METHOD</span>
      <span><i class="ln" style="background:#2f3a52"></i>IMPORTS</span>
    </div>
  </div>
  <div id="drawer">
    <div class="dhead">
      <button class="close" id="dClose">✕</button>
      <div class="name" id="dName">—</div>
      <div class="fqn" id="dFqn"></div>
    </div>
    <div class="dbody" id="dBody"></div>
  </div>
</main>
<script>
"use strict";
let graph=null;
const EDGE={CALLS:{c:"#8a94ff",w:1.5},CONTAINS:{c:"#3d4c66",w:1},HAS_METHOD:{c:"#9d7bff",w:1.2},IMPORTS:{c:"#2f3a52",w:1}};
const COL={File:["#5a3a1e","#f0a35e","rect"],Class:["#155a54","#4fd1c5","hexagon"],Function:["#23418a","#5b8def","circle"]};
const {Graph}=G6;

async function jget(u){const r=await fetch(u);const j=await r.json();if(!r.ok)throw new Error(j.error||"HTTP "+r.status);return j}

/* ── 数据结构：server → G6 ── */
function toNodes(list){return list.map(n=>({id:n.id,data:{label:n.label==="Function"?n.name:n.file||n.name,group:n.label,file:n.file,fqn:n.id}}))}
function toEdges(list){return list.map(e=>({source:e.from,target:e.to,data:{type:e.type}}))}

/* ── 初始化 ── */
async function loadStats(){
  try{const s=await jget("/api/stats");
    document.getElementById("stats").innerHTML=
      `<div class="stat"><b>${s.files}</b><span>FILES</span></div><div class="stat"><b>${s.functions}</b><span>FUNCS</span></div><div class="stat"><b>${s.classes}</b><span>CLASSES</span></div><div class="stat"><b>${s.total_edges}</b><span>EDGES</span></div>`;
    document.getElementById("langBar").innerHTML=Object.entries(s.languages||{}).map(([k,v])=>`<span class="lang"><b>${k}</b> ${v}</span>`).join("");
  }catch(e){console.error(e)}
}
async function loadModules(){
  try{const g=await jget("/api/graph?limit=600");const files=g.nodes.filter(n=>n.label==="File").map(n=>n.file||n.name);
    const seen=new Set(),mods=[];for(const f of files){const p=f.replace(/\\/g,"/"),parts=p.split("/"),m=parts.length>1?parts[0]+"/"+parts[1]:p;if(!seen.has(m)){seen.add(m);mods.push({m,c:files.filter(x=>x.startsWith(m)).length})}}
    mods.sort((a,b)=>b.c-a.c);
    document.getElementById("modCount").textContent=mods.length;
    document.getElementById("modList").innerHTML=mods.slice(0,40).map(m=>`<div class="row" onclick="focusMod('${m.m.replace(/'/g,"\\'")}')"><span class="id">${m.m}</span><span class="tag">${m.c}</span></div>`).join("")||'<div class="hint">无模块</div>';
  }catch(e){document.getElementById("modList").innerHTML='<div class="hint">'+e.message+'</div>'}
}

/* ── G6 图谱：开箱即用交互（拖拽/缩放/hover 高亮/点击选中/tooltip）── */
async function loadGraph(){
  try{
    const g=await jget("/api/graph?limit=120");
    const el=document.getElementById("graph");
    if(!g.nodes.length){document.getElementById("empty").style.display="flex";return}
    document.getElementById("empty").style.display="none";
    graph=new Graph({
      container:el,autoFit:"view",
      data:{nodes:toNodes(g.nodes),edges:toEdges(g.edges)},
      node:{
        style:{
          shape:d=>COL[d.data.group]?COL[d.data.group][2]:"circle",
          fill:d=>COL[d.data.group]?COL[d.data.group][0]:"#222b40",
          stroke:d=>COL[d.data.group]?COL[d.data.group][1]:"#8a94ff",
          lineWidth:1.5,size:d=>d.data.group==="File"?[26,20]:d.data.group==="Class"?24:9,
          labelText:d=>d.data.label,labelFill:"#cdd6e4",labelFontSize:10,labelPlacement:"bottom",labelOffsetY:6,
          halo:true,haloLineWidth:10,haloStroke:"rgba(91,141,239,0.25)",
        },
        state:{selected:{lineWidth:3,stroke:"#fff",halo:true,haloLineWidth:14,haloStroke:"rgba(91,141,239,0.45)"},
               active:{lineWidth:2,halo:true,haloLineWidth:14,haloStroke:"rgba(91,141,239,0.35)"}}
      },
      edge:{
        style:{
          stroke:d=>EDGE[d.data.type]?EDGE[d.data.type].c:"#556",
          lineWidth:d=>EDGE[d.data.type]?EDGE[d.data.type].w:1,
          endArrow:d=>d.data.type==="CALLS"||d.data.type==="HAS_METHOD"?{path:"M0,0 L8,4 L8,-4 Z",fill:d=>EDGE[d.data.type].c}:false,
          lineDash:d=>d.data.type==="IMPORTS"?[4,3]:null,
        },
        state:{active:{lineWidth:2.5,stroke:"#fff"}}
      },
      layout:{type:"force",linkDistance:90,nodeStrength:300,edgeStrength:200,preventOverlap:true,nodeSize:d=>d.data.group==="File"?26:10},
      behaviors:["drag-canvas","zoom-canvas","drag-element","click-select","hover-activate",
                 {type:"tooltip",content:d=>`<div style="padding:6px 9px;font-size:11px;background:#1a2132;border:1px solid #232c42;border-radius:6px">${d.id}<br><span style="color:#66728a">${d.data&&d.data.group||''} · ${d.data&&d.data.file||''}</span></div>`}],
    });
    graph.on("node:click",e=>{showDetail(e.target.id);expandNode(e.target.id)});
    graph.on("node:dblclick",e=>{expandNode(e.target.id)});
    graph.render();
  }catch(e){const el=document.getElementById("empty");el.style.display="flex";el.textContent="图谱加载失败："+e.message}
}

/* ── 按需展开 ── */
async function expandNode(id){
  if(!graph)return;
  try{
    const g=await jget(`/api/graph?seed=${encodeURIComponent(id)}&depth=1&limit=120`);
    if(!g.nodes.length)return;
    graph.addNodeData(toNodes(g.nodes));
    graph.addEdgeData(toEdges(g.edges));
    graph.layout();
  }catch(e){}
}
function focus(id){if(graph){try{graph.focusElement(id,{animation:{duration:300}})}catch(_){}}}

/* ── 详情抽屉 ── */
async function showDetail(id){
  document.getElementById("dName").innerHTML='<span class="type-badge tb-fn">符号</span>'+id.split(".").pop();
  document.getElementById("dFqn").textContent=id;
  document.getElementById("dBody").innerHTML='<div class="dempty">加载中…</div>';
  document.getElementById("drawer").classList.add("open");
  try{
    const[cl,ce]=await Promise.all([jget(`/api/callers?symbol=${encodeURIComponent(id)}&depth=2`),jget(`/api/callees?symbol=${encodeURIComponent(id)}&depth=2`)]);
    const up=cl.map(x=>`<div class="kv"><span class="depth">d${x.depth}</span><span class="idv up">${x.caller}</span></div>`).join("");
    const down=ce.map(x=>`<div class="kv"><span class="depth">d${x.depth}</span><span class="idv down">${x.callee}</span></div>`).join("");
    document.getElementById("dBody").innerHTML=
      (up?`<div class="dsec">上游调用者 · ${cl.length}</div>${up}`:"")+
      (down?`<div class="dsec">下游被调用 · ${ce.length}</div>${down}`:"")+
      (!up&&!down?'<div class="dempty">无直接调用关系（双击节点展开其邻居）</div>':"");
  }catch(e){document.getElementById("dBody").innerHTML='<div class="dempty">加载失败：'+e.message+'</div>'}
}
document.getElementById("dClose").onclick=()=>document.getElementById("drawer").classList.remove("open");

/* ── 搜索 / 符号 / 模块 ── */
async function doSearch(){
  const q=document.getElementById("searchInput").value.trim(),btn=document.getElementById("searchBtn"),list=document.getElementById("symList");
  if(!q)return;btn.disabled=true;btn.textContent="检索中…";list.innerHTML="";
  try{const r=await jget(`/api/search?q=${encodeURIComponent(q)}&k=8`);
    list.innerHTML=r.map(x=>`<div class="row" onclick="jumpTo('${x.id.replace(/'/g,"\\'")}')"><span class="id">${x.id}</span><span class="tag">${x.score.toFixed(2)}</span></div>`).join("")||'<div class="hint">无命中</div>';
  }catch(e){list.innerHTML='<div class="hint">'+e.message+'</div>'}finally{btn.disabled=false;btn.textContent="检索"}
}
async function doSym(){
  const q=document.getElementById("symInput").value.trim(),list=document.getElementById("symList");if(!q)return;
  try{const r=await jget(`/api/symbols?q=${encodeURIComponent(q)}&limit=30`);
    list.innerHTML=r.map(x=>`<div class="row" onclick="jumpTo('${x.id.replace(/'/g,"\\'")}')"><span class="id">${x.id}</span><span class="tag">${x.label}</span></div>`).join("")||'<div class="hint">无匹配</div>';
  }catch(e){list.innerHTML='<div class="hint">'+e.message+'</div>'}
}
async function jumpTo(id){if(!graph)return;await expandNode(id);await expandNode(id);focus(id);showDetail(id)}
async function focusMod(m){if(!graph)return;try{const g=await jget("/api/graph?limit=600");const fid=g.nodes.find(n=>n.label==="File"&&(n.file||n.name).startsWith(m));if(!fid){alert("未找到该模块文件");return}await expandNode(fid.id);focus(fid.id);showDetail(fid.id)}catch(e){}}

document.getElementById("searchBtn").onclick=doSearch;
document.getElementById("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch()});
document.getElementById("symBtn").onclick=doSym;
document.getElementById("symInput").addEventListener("keydown",e=>{if(e.key==="Enter")doSym()});
loadStats();loadModules();loadGraph();
</script>
</body>
</html>
