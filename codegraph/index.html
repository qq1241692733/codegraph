<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codegraph · 代码知识图谱</title>
<style>
  /* ── Ant Design 深色设计 token ── */
  :root{
    --bg:#0c0f16; --bg-grad:radial-gradient(ellipse at 50% 30%,#16203a 0%,#0c0f16 68%);
    --panel:#131722; --panel-2:#1a2132; --panel-3:#222b40; --border:#232c42; --border-soft:#1c2336;
    --text:#e8edf7; --text-2:#a8b3c7; --text-3:#66728a;
    --primary:#5b8def; --primary-2:#7a5cff; --grad:linear-gradient(135deg,#4f8cff,#7a5cff);
    --success:#3ecf8e; --warn:#f0a35e; --info:#4fd1c5;
    --shadow:0 8px 30px rgba(0,0,0,.45);
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:13px;display:flex;flex-direction:column;overflow:hidden}
  code,.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}::-webkit-scrollbar-track{background:transparent}
  button{font-family:inherit}

  /* ── Header ── */
  header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:rgba(19,23,34,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:5}
  .brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
  .logo{width:30px;height:30px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;box-shadow:0 0 18px rgba(79,140,255,.45);letter-spacing:.5px}
  .brand h1{font-size:15px;font-weight:700;letter-spacing:.3px}
  .brand .sub{font-size:10px;color:var(--text-3);letter-spacing:.6px;text-transform:uppercase;margin-top:1px}
  /* 中央全局搜索（Sourcegraph 风格） */
  .gsearch{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 14px;transition:border-color .2s,box-shadow .2s}
  .gsearch:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,141,239,.18)}
  .gsearch svg{color:var(--text-3);flex-shrink:0}
  .gsearch input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px}
  .gsearch input::placeholder{color:var(--text-3)}
  .gsearch .gbtn{padding:5px 16px;border:none;border-radius:7px;background:var(--grad);color:#fff;font-size:12px;font-weight:600;cursor:pointer;transition:filter .15s;white-space:nowrap}
  .gsearch .gbtn:hover{filter:brightness(1.12)}
  .gsearch .gbtn:disabled{opacity:.55;cursor:default}
  .stats{display:flex;flex-shrink:0;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .stat{padding:6px 15px;text-align:center;border-right:1px solid var(--border-soft)}
  .stat:last-child{border-right:none}
  .stat b{display:block;font-size:15px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.2px}
  .stat span{font-size:9.5px;color:var(--text-3);letter-spacing:.6px}

  /* ── 主体布局 ── */
  main{flex:1;display:flex;min-height:0;position:relative}
  aside{width:284px;min-width:284px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:margin-left .25s}
  aside.collapsed{margin-left:-284px}
  #graph{flex:1;position:relative;background:var(--bg-grad)}
  #empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-3);text-align:center;padding:20px}
  #empty .big{font-size:15px;color:var(--text-2)}

  /* ── 侧栏控件 ── */
  .sec{padding:14px 16px;border-bottom:1px solid var(--border-soft)}
  .sec .title{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .sec h3{font-size:10.5px;color:var(--text-3);font-weight:600;letter-spacing:1.2px;text-transform:uppercase}
  .badge{font-size:10px;color:var(--text-3);background:var(--panel-3);padding:1px 7px;border-radius:10px}
  .field{display:flex;gap:7px}
  .field input{flex:1;min-width:0;padding:8px 11px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12.5px;outline:none;transition:border-color .15s,box-shadow .15s}
  .field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,141,239,.15)}
  .field input::placeholder{color:var(--text-3)}
  .btn{padding:8px 13px;border:none;border-radius:8px;background:var(--grad);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;transition:filter .15s,opacity .15s;white-space:nowrap}
  .btn:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.55;cursor:default}
  .list{display:flex;flex-direction:column;gap:4px;margin-top:9px;max-height:150px;overflow-y:auto}
  .row{padding:6px 10px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:7px;font-size:11.5px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;transition:border-color .12s,background .12s}
  .row:hover{border-color:var(--primary);background:var(--panel-3)}
  .row .id{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:inherit;color:var(--text-2)}
  .row .tag{font-size:9px;padding:1px 6px;border-radius:9px;flex-shrink:0;color:var(--text-2);background:rgba(255,255,255,.06)}
  .hint{color:var(--text-3);font-size:11px;margin-top:8px;line-height:1.6}
  .langs{display:flex;flex-wrap:wrap;gap:6px}
  .lang{font-size:11px;padding:3px 10px;border-radius:14px;background:var(--panel-2);border:1px solid var(--border);color:var(--text-2)}
  .lang b{color:var(--text);font-weight:600}

  /* ── 图例 ── */
  .legend{position:absolute;bottom:16px;left:16px;background:rgba(19,23,34,.9);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-size:11px;display:flex;gap:14px;flex-wrap:wrap;box-shadow:var(--shadow);z-index:2}
  .legend span{display:flex;align-items:center;gap:6px;color:var(--text-2)}
  .legend i{width:12px;height:12px;border-radius:3px}
  .legend .dot{border-radius:50%}
  .legend .hex{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--info)}
  .legend .sq{background:var(--warn);border-radius:2px}
  .legend .ln{width:16px;height:2.5px;border-radius:2px;background:#8a94ff}

  /* ── 右侧详情抽屉 ── */
  #drawer{position:absolute;top:0;right:0;bottom:0;width:340px;background:var(--panel);border-left:1px solid var(--border);box-shadow:-8px 0 30px rgba(0,0,0,.4);transform:translateX(105%);transition:transform .25s ease;z-index:4;display:flex;flex-direction:column;overflow:hidden}
  #drawer.open{transform:translateX(0)}
  .dhead{padding:14px 18px;border-bottom:1px solid var(--border-soft);display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .dhead .dtitle{min-width:0}
  .dhead .name{font-size:14px;font-weight:650;word-break:break-all;display:flex;align-items:center;gap:7px}
  .dhead .fqn{font-size:11px;color:var(--text-3);margin-top:5px;word-break:break-all}
  .type-badge{font-size:9.5px;padding:2px 8px;border-radius:8px;font-weight:600;letter-spacing:.4px;color:#fff;flex-shrink:0}
  .tb-fn{background:#2b4a8f}.tb-cl{background:#1f6b62}.tb-fl{background:#7a4a1e}
  .close{background:none;border:none;color:var(--text-3);font-size:18px;cursor:pointer;line-height:1;padding:2px}
  .close:hover{color:var(--text)}
  .dbody{flex:1;overflow-y:auto;padding:12px 18px}
  .dsec{font-size:10px;color:var(--text-3);letter-spacing:1px;text-transform:uppercase;margin:14px 0 7px;font-weight:600}
  .dsec:first-child{margin-top:4px}
  .kv{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--border-soft)}
  .kv .depth{color:var(--text-3);font-size:10.5px;flex-shrink:0}
  .kv .idv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kv .up{color:var(--success)} .kv .down{color:var(--info)}
  .dempty{padding:14px 0;color:var(--text-3);font-size:12px}

  /* 折叠按钮 */
  .foldbtn{position:absolute;top:14px;right:14px;z-index:6;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text-2);cursor:pointer;font-size:14px;display:none;align-items:center;justify-content:center}
  @media(max-width:980px){ .foldbtn{display:flex} }
</style>
<script src="/static/vis-network.min.js"></script>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">cg</div>
    <div><h1>codegraph</h1><div class="sub">Code Knowledge Graph</div></div>
  </div>
  <div class="gsearch">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="searchInput" placeholder="语义检索：输入意图，如「做登录鉴权的函数」" autocomplete="off">
    <button class="gbtn" id="searchBtn" disabled>检索</button>
  </div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <aside id="sidebar">
    <div class="sec">
      <div class="title"><h3>符号定位</h3></div>
      <div class="field">
        <input id="symInput" placeholder="如 Gson.fromJson" autocomplete="off">
        <button class="btn" id="symBtn">定位</button>
      </div>
      <div class="list" id="symList"></div>
      <div class="hint">匹配代码符号，点击后加载其局部子图并聚焦。</div>
    </div>
    <div class="sec" style="flex:1;min-height:120px;display:flex;flex-direction:column">
      <div class="title"><h3>模块 · 文件</h3><span class="badge" id="modCount">0</span></div>
      <div class="list" style="max-height:none;flex:1" id="modList"></div>
      <div class="hint">点击模块加载首层文件及其邻居，聚焦到该区域。</div>
    </div>
    <div class="sec">
      <div class="title"><h3>语言分布</h3></div>
      <div class="langs" id="langBar"></div>
    </div>
  </aside>
  <div id="graph">
    <button class="foldbtn" id="foldBtn" title="折叠/展开侧栏">«</button>
    <div id="empty">
      <div class="big">图谱待加载</div>
      <div>搜索符号、点击模块，或点击图谱节点逐层展开</div>
    </div>
    <div class="legend">
      <span><i class="sq"></i>File</span>
      <span><i class="hex"></i>Class</span>
      <span><i class="dot" style="background:#5b8def"></i>Function</span>
      <span><i class="ln"></i>CALLS</span>
      <span><i class="ln" style="background:#3d4c66"></i>CONTAINS</span>
      <span><i class="ln" style="background:#9d7bff"></i>HAS_METHOD</span>
      <span><i class="ln" style="background:#2f3a52"></i>IMPORTS</span>
    </div>
  </div>
  <div id="drawer">
    <div class="dhead">
      <div class="dtitle">
        <div class="name" id="dName">—</div>
        <div class="fqn" id="dFqn"></div>
      </div>
      <button class="close" id="dClose" title="关闭">✕</button>
    </div>
    <div class="dbody" id="dBody"></div>
  </div>
</main>
<script>
"use strict";
let network=null, drawerOpen=false, allMods=[];
const EDGE={CALLS:{c:"#8a94ff",w:1.5},CONTAINS:{c:"#3d4c66",w:1},HAS_METHOD:{c:"#9d7bff",w:1.2},IMPORTS:{c:"#2f3a52",w:1}};
const NODE={
  File:{bg:"#5a3a1e",border:"#f0a35e",shape:"box",w:30},
  Class:{bg:"#155a54",border:"#4fd1c5",shape:"hexagon",w:26},
  Function:{bg:"#23418a",border:"#5b8def",shape:"dot",w:12}
};

async function jget(url){const r=await fetch(url);const j=await r.json();if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j;}

/* ── 样式函数（初始种子与按需展开共用）── */
function nodeStyle(n){return{id:n.id,label:n.label==="Function"?n.name:n.file||n.name,
  title:`${n.label}\n${n.file}`,group:n.label,shape:NODE[n.label].shape,
  borderWidth:1.4,borderWidthSelected:3,shadow:{enabled:true,color:"rgba(91,141,239,.45)",size:10,x:0,y:0},
  color:{background:NODE[n.label].bg,border:NODE[n.label].border,
    highlight:{background:NODE[n.label].border,border:"#fff"},
    hover:{background:NODE[n.label].bg,border:"#fff"}},
  size:NODE[n.label].w,font:{color:"#cdd6e4",size:n.label==="File"?12:10,face:"ui-monospace,Menlo,monospace"}}}
function edgeStyle(e){return{from:e.from,to:e.to,color:{color:EDGE[e.type]?EDGE[e.type].c:"#556"},
  width:EDGE[e.type]?EDGE[e.type].w:1,title:e.type,smooth:{enabled:true,type:"dynamic"},arrows:{to:{enabled:e.type==="CALLS"||e.type==="HAS_METHOD"}}}}

/* ── 初始化 ── */
async function loadStats(){
  try{
    const s=await jget("/api/stats");
    document.getElementById("stats").innerHTML=
      `<div class="stat"><b>${s.files}</b><span>FILES</span></div>`+
      `<div class="stat"><b>${s.functions}</b><span>FUNCS</span></div>`+
      `<div class="stat"><b>${s.classes}</b><span>CLASSES</span></div>`+
      `<div class="stat"><b>${s.total_edges}</b><span>EDGES</span></div>`;
    document.getElementById("langBar").innerHTML=
      Object.entries(s.languages||{}).map(([k,v])=>`<span class="lang"><b>${k}</b> ${v}</span>`).join("");
  }catch(e){console.error(e)}
}
async function loadModules(){
  try{
    const g=await jget("/api/graph?limit=600");
    const files=g.nodes.filter(n=>n.label==="File").map(n=>n.file||n.name);
    const seen=new Set(),mods=[];
    for(const f of files){const p=f.replace(/\\/g,"/"),parts=p.split("/");
      const mod=parts.length>1?parts[0]+"/"+parts[1]:p;
      if(!seen.has(mod)){seen.add(mod);mods.push({m:mod,c:files.filter(x=>x.startsWith(mod)).length});}}
    mods.sort((a,b)=>b.c-a.c);
    allMods=mods;
    document.getElementById("modCount").textContent=mods.length;
    document.getElementById("modList").innerHTML=mods.slice(0,40).map(m=>
      `<div class="row" onclick="focusMod('${m.m.replace(/'/g,"\\'")}')"><span class="id">${m.m}</span><span class="tag">${m.c}</span></div>`).join("")||'<div class="hint">无模块</div>';
  }catch(e){document.getElementById("modList").innerHTML='<div class="hint">'+e.message+'</div>'}
}

async function loadGraph(){
  try{
    const g=await jget("/api/graph?limit=120");
    const container=document.getElementById("graph");
    const empty=document.getElementById("empty");
    if(!g.nodes.length){empty.style.display="flex";return}
    empty.style.display="none";
    network=new vis.Network(container,
      {nodes:new vis.DataSet(g.nodes.map(nodeStyle)),edges:new vis.DataSet(g.edges.map(edgeStyle))},
      {nodes:{font:{color:"#cdd6e4"}},edges:{color:{inherit:false},smooth:{enabled:true,type:"dynamic"}},
       layout:{improvedLayout:true},
       physics:{enabled:true,solver:"barnesHut",
         barnesHut:{gravitationalConstant:-3600,centralGravity:0.03,springLength:105,springConstant:0.035,damping:0.1},
         stabilization:{enabled:true,iterations:200,updateInterval:40}},
       interaction:{hover:true,tooltipDelay:120,zoomView:true,dragView:true,navigationButtons:true,keyboard:true},
       groups:{
         File:{color:{background:"#5a3a1e",border:"#f0a35e"}},
         Class:{color:{background:"#155a54",border:"#4fd1c5"}},
         Function:{color:{background:"#23418a",border:"#5b8def"}}}});
    network.on("click",p=>{if(p.nodes.length){showDetail(p.nodes[0]);expandNode(p.nodes[0]);}});
    network.on("doubleClick",p=>{if(p.nodes.length)expandNode(p.nodes[0]);});
    network.on("selectNode",p=>{if(p.nodes.length)showDetail(p.nodes[0]);});
  }catch(e){document.getElementById("empty").innerHTML='<div class="big">加载失败</div><div>'+e.message+'</div>';empty.style.display="flex"}
}

/* ── 按需展开（参考 Sourcegraph/Neo4j 导航）── */
async function expandNode(id){
  if(!network)return;
  try{
    const g=await jget(`/api/graph?seed=${encodeURIComponent(id)}&depth=1&limit=120`);
    if(!g.nodes.length)return;
    network.body.data.nodes.add(g.nodes.map(nodeStyle));
    network.body.data.edges.add(g.edges.map(edgeStyle));
  }catch(e){/* 静默 */}
}
function focus(id){if(network){try{network.focus(id,{scale:1.5,animation:{duration:400,easingFunction:"easeInOutQuad"}});network.selectNodes([id]);}catch(_){}}}

/* ── 详情抽屉 ── */
async function showDetail(id){
  const name=document.getElementById("dName"),fqn=document.getElementById("dFqn"),body=document.getElementById("dBody");
  name.innerHTML='<span class="type-badge tb-fn">符号</span><span>'+id.split(".").pop()+'</span>';
  fqn.textContent=id; body.innerHTML='<div class="dempty">加载中…</div>'; openDrawer();
  try{
    const [cl,ce]=await Promise.all([
      jget(`/api/callers?symbol=${encodeURIComponent(id)}&depth=2`),
      jget(`/api/callees?symbol=${encodeURIComponent(id)}&depth=2`)]);
    const up=cl.map(x=>`<div class="kv"><span class="depth">d${x.depth}</span><span class="idv up">${x.caller}</span></div>`).join("");
    const down=ce.map(x=>`<div class="kv"><span class="depth">d${x.depth}</span><span class="idv down">${x.callee}</span></div>`).join("");
    body.innerHTML=
      (up?`<div class="dsec">上游调用者 · ${cl.length}</div>${up}`:"")+
      (down?`<div class="dsec">下游被调用 · ${ce.length}</div>${down}`:"")+
      (!up&&!down?'<div class="dempty">无直接调用关系（双击节点可展开其邻居）</div>':"");
  }catch(e){body.innerHTML='<div class="dempty">加载失败：'+e.message+'</div>'}
}
function openDrawer(){document.getElementById("drawer").classList.add("open");drawerOpen=true;}
function closeDrawer(){document.getElementById("drawer").classList.remove("open");drawerOpen=false;}
document.getElementById("dClose").onclick=closeDrawer;

/* ── 交互：搜索 / 符号 / 模块 ── */
async function doSearch(){
  const q=document.getElementById("searchInput").value.trim(),btn=document.getElementById("searchBtn"),list=document.getElementById("symList");
  if(!q)return;btn.disabled=true;btn.textContent="检索中…";list.innerHTML="";
  try{
    const r=await jget(`/api/search?q=${encodeURIComponent(q)}&k=8`);
    list.innerHTML=r.map(x=>`<div class="row" onclick="jumpTo('${x.id.replace(/'/g,"\\'")}')"><span class="id">${x.id}</span><span class="tag">${x.score.toFixed(2)}</span></div>`).join("")||'<div class="hint">无命中，试试其他描述</div>';
  }catch(e){list.innerHTML='<div class="hint">'+e.message+'</div>';}finally{btn.disabled=false;btn.textContent="检索"}
}
async function doSym(){
  const q=document.getElementById("symInput").value.trim(),list=document.getElementById("symList");
  if(!q)return;
  try{
    const r=await jget(`/api/symbols?q=${encodeURIComponent(q)}&limit=30`);
    list.innerHTML=r.map(x=>`<div class="row" onclick="jumpTo('${x.id.replace(/'/g,"\\'")}')"><span class="id">${x.id}</span><span class="tag">${x.label}</span></div>`).join("")||'<div class="hint">无匹配符号</div>';
  }catch(e){list.innerHTML='<div class="hint">'+e.message+'</div>'}
}
/* 关键修复：跳转到符号 → 先加载其局部子图再聚焦，否则种子图里没有该函数 */
async function jumpTo(id){
  if(!network)return;
  await expandNode(id); await expandNode(id); // 两级展开，确保出现
  focus(id); showDetail(id);
}
async function focusMod(m){
  if(!network)return;
  try{
    const g=await jget("/api/graph?limit=600");
    const fid=g.nodes.find(n=>n.label==="File"&&(n.file||n.name).startsWith(m));
    if(!fid){alert("未找到该模块的文件");return}
    await expandNode(fid.id);
    const ids=[fid.id,...g.nodes.filter(n=>(n.file||n.name).startsWith(m)).map(n=>n.id)];
    network.selectNodes(ids);network.fit({nodes:ids,animation:{duration:500}});
  }catch(e){console.error(e)}
}

/* ── 事件绑定 ── */
document.getElementById("searchBtn").onclick=doSearch;
document.getElementById("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch();});
document.getElementById("symBtn").onclick=doSym;
document.getElementById("symInput").addEventListener("keydown",e=>{if(e.key==="Enter")doSym();});
